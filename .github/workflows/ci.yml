name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snake_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Snake UI save, touch/layout, resource cleanup and recovery (local fixtures)
        run: npm run test:snake-ui
      - name: Preserve Snake UI fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-ui-fixture-evidence
          path: |
            test-results/snake-ui/
            test-results/qc-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Snake catalog candidate and offline package
        run: npm run build && npm run build:snake-catalog && npm run test:snake-catalog
      - name: Preserve Snake catalog candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-catalog-fixture-evidence
          path: test-results/snake-catalog/
          if-no-files-found: ignore
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    # Includes all-game motion plus per-game browser suites on the hosted Linux runner.
    # Keep individual test assertions/timeouts unchanged; allow the full sequence to finish.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install room server dependencies before typechecking browser fixtures
        run: npm run deps:tank-clash
      - name: Markdown handoff budgets, task links and pinned Studio sources
        run: python3 scripts/check-docs.py
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Snake local suites and preview baseline (no live backend)
        run: npm run test:snake-local && npm run build:snake-preview && npm run test:snake-preview && npm run analyze:snake-preview
      - name: Preserve Snake build profile before browser suites clear output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-build-profile
          path: test-results/snake-baseline/build-profile.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Bundle budget (no chunk > 500 kB, first-load JS <= 400 kB gzip)
        run: npm run test:bundle
      - name: Fast test suites (no browser, no Docker)
        run: npm run test:fast
      - name: Tank Clash room server, auth, origins, capacity and restart over real WebSockets (loopback)
        run: npm run test:tank-clash-server
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser fixture transport and offline emulation across reload
        run: npm run test:browser-harness
      - name: Public content and ad placement preview (no live advertising)
        run: npm run test:ads && npm run test:ads-production
      - name: Snake guest preview route, Auth entry, responsive layout and parent service worker
        run: npm run test:snake-preview-runtime
      - name: Preserve Snake route and layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-preview-runtime-evidence
          path: test-results/snake-baseline/
          if-no-files-found: ignore
          retention-days: 7
      - name: Launcher idle render budget
        run: npm run test:perf
      - name: Launcher smoke flows
        run: npm run test:smoke
      - name: Every game launches, takes input and exits
        run: npm run test:games
      - name: Desktop animation isolation and Canvas loops (all games, normal and reduced motion)
        run: npm run test:animations
      - name: Neon Run sound, feel and controls
        run: npm run test:neon-feel
      - name: Offline launcher shell
        run: npm run test:offline
      - name: Keep Word Chain offline evidence before later Playwright suites clear their output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-chain-offline-evidence
          path: test-results/word-chain-offline*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Modal frame (AGENTS.md sizing)
        run: npm run test:modals
      - name: Blossom Blast tutorials, layout, results and saves (Playwright, dev server)
        run: npm run test:blossom-ui
      - name: Battleship perspective board, placement and taps (Playwright, dev server)
        run: npm run test:battleship-ui
      - name: Nối Từ practice match (Playwright, dev server)
        run: npm run test:word-chain-ui
      - name: Keep Word Chain desktop and phone visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-chain-ui-evidence
          path: test-results/word-chain-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Tank Clash online 1v1/2v2, parties, queue and local bots (Playwright + room server)
        run: npm run test:tank-clash-ui
      - name: Generated files are not left behind
        run: git diff --exit-code && test -z "$(git status --porcelain)"
