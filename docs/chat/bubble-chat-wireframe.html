<style>

#arcadex-chat-review .ax h2,#arcadex-chat-review .ax h3,#arcadex-chat-review .ax p{margin:0}#arcadex-chat-review .ax h2{font-size:20px;font-weight:500}#arcadex-chat-review .ax h3{font-size:16px;font-weight:500}#arcadex-chat-review .ax small{font-size:12px;color:var(--ax-dim)}#arcadex-chat-review .ax-top{height:78px;padding:12px 112px 12px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ax-line);background:var(--ax-surface)}#arcadex-chat-review .ax-brand{font-weight:500;letter-spacing:.08em}#arcadex-chat-review .ax-title{display:flex;flex-direction:column;gap:2px}#arcadex-chat-review .ax-body{position:relative;height:488px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:22px}#arcadex-chat-review .ax-foot{height:54px;padding:8px 16px;border-top:1px solid var(--ax-line);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ax-surface)}#arcadex-chat-review .ax-foot button{min-height:36px;padding:5px 10px}#arcadex-chat-review .ax-content{min-width:0}#arcadex-chat-review .ax-games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}#arcadex-chat-review .ax-game{background:var(--ax-surface);border:1px solid var(--ax-line);padding:18px 12px;border-radius:14px;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}#arcadex-chat-review .ax-art{font-size:28px}#arcadex-chat-review .ax-rail{background:var(--ax-safe);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}#arcadex-chat-review .ax-player{display:flex;align-items:center;gap:10px;min-height:48px}#arcadex-chat-review .ax-avatar{width:44px;height:44px;display:grid;place-items:center;background:var(--ax-sub);border:1px solid var(--ax-line);border-radius:50%;font-size:22px;flex-shrink:0}#arcadex-chat-review .ax-speech{position:relative;background:var(--ax-surface);border:1px solid var(--ax-line);border-radius:14px 14px 14px 3px;padding:10p #arcadex-chat-review .ax-bubble{position:absolute;z-index:6;top:15px;right:18px;width:48px;height:48px;border-radius:50%!important;touch-action:none!important;cursor:grab;padding:0!important;box-shadow:0 4px 16px #0002}#arcadex-chat-review .ax-bubble:active{cursor:grabbing}#arcadex-chat-review .ax-dot{display:block;position:absolute;right:0;top:0;width:12px;height:12px;background:var(--ax-dot);border:2px solid var(--ax-surface);border-radius:50%}#arcadex-chat-review .ax-panel{position:absolute;z-index:8;left:16px;bottom:68px;width:320px;height:224px;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:0;background:var(--ax-surface);border:1px solid var(--ax-line);border-radius:16px;box-shadow:0 12px 32px #0003;overflow:hidden}#arcadex-chat-review .ax-panel-head{display:flex;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--ax-line);touch-action:none;cursor:grab;flex-shrink:0}#arcadex-chat-review .ax-panel-name{margin-right:auto;font-weight:500}#arcadex-chat-review .ax-panel-head button{padding:4px;min-width:44px}#arcadex-chat-review .ax-channels{display:flex;gap:4px;padding:6px 8px;flex-shrink:0}#arcadex-chat-review .ax-channels button{padding:4px 9px;min-height:36px;font-size:12px}#arcadex-chat-review .ax-messages{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 12px;display:flex;flex-direction:column;gap:8px}#arcadex-chat-review .ax-message{background:var(--ax-sub);padding:7px 10px;border-radius:4px 12px 12px 12px;max-width:93%;overflow-wrap:anywhere;flex-shrink:0}#arcadex-chat-review .ax-message small{display:block}#arcadex-chat-review .ax-message.mine{align-self:flex-end;border-radius:12px 4px 12px 12px}#arcadex-chat-review .ax-compose{padding:8px;display:flex;gap:6px;flex-shrink:0;border-top:1px solid var(--ax-line)}#arcadex-chat-review .ax-compose input{background:var(--ax-bg);border:1px solid var(--ax-line);border-radius:10px;padding:8px;min-width:0;width:0;flex:1}#arcadex-chat-review .ax-panel.large{width:440px;height:400px}#arcadex-chat-review .ax-panel.expanded{left:12px!important;top:12px!important;bottom:12px;right:12px;width:auto!important;height:auto!important;max-width:none}#arcadex-chat-review .ax-resize{position:absolute;bottom:0;right:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 60%,var(--ax-line) 62%,var(--ax-line) 69%,transparent 71%)}#arcadex-chat-review .ax-status{font-size:12px;color:var(--ax-dim);max-width:58%}#arcadex-chat-review .ax-phone{max-width:360px;margin:0 auto;border-radius:24px}#arcadex-chat-review .ax-phone .ax-top{padding-left:12px;padding-right:76px}#arcadex-chat-review .ax-phone .ax-body{display:flex;flex-direction:column;padding:12px;gap:10px}#arcadex-chat-review .ax-phone .ax-rail{padding:8px;gap:6px;order:-1;background:transparent}#arcadex-chat-review .ax-phone .ax-player{min-height:44px}#arcadex-chat-review .ax-phone .ax-speech{padding:8px 10px;min-height:44px}#arcadex-chat-review .ax-phone .ax-board{width:244px;margin:8px auto}#arcadex-chat-review .ax-phone .ax-divider,#arcadex-chat-review .ax-phone .ax-rail .ax-hint{display:none}#arcadex-chat-review .ax-phone .ax-foot{padding:6px 10px}#arcadex-chat-review .ax-phone .ax-panel.expanded{inset:0;border-radius:0;border:0}#arcadex-chat-review .ax-phone .ax-compose input{font-size:16px}
@media(max-width:740px){#arcadex-chat-review .ax:not(.ax-phone) .ax-body{grid-template-columns:minmax(0,1fr) 200px;padding:14px;gap:14px}#arcadex-chat-review .ax:not(.ax-phone) .ax-rail{padding:10px}#arcadex-chat-review .ax-game{min-height:100px;padding:12px}#arcadex-chat-review .ax-top{padding-left:12px}#arcadex-chat-review .ax-panel.game-open{inset:0!important;width:auto!important;height:auto!important;max-width:none;border-radius:0}}
@media(max-width:500px){#arcadex-chat-review .ax:not(.ax-phone) .ax-body{display:flex;flex-direction:column;padding:12px;gap:8px}#arcadex-chat-review .ax:not(.ax-phone) .ax-rail{order:-1;padding:6px;background:transparent;gap:6px}#arcadex-chat-review .ax:not(.ax-phone) .ax-rail .ax-hint,#arcadex-chat-review .ax:not(.ax-phone) .ax-divider{display:none}#arcadex-chat-review .ax:not(.ax-phone) .ax-board{width:246px;margin:8px auto}#arcadex-chat-review .ax:not(.ax-phone) .ax-arena{height:238px}#arcadex-chat-review .ax-games{gap:8px;margin-top:10px}#arcadex-chat-review .ax-game{min-height:92px}#arcadex-chat-review .ax-art{font-size:22px}#arcadex-chat-review .ax-top{padding-right:76px}#arcadex-chat-review .ax-top h2{font-size:17px}#arcadex-chat-review .ax-brand{display:none}#arcadex-chat-review .ax-foot{padding:6px 10px}#arcadex-chat-review .ax-status{max-width:52%}#arcadex-chat-review .ax-panel{left:12px;width:calc(100% - 24px);max-width:calc(100% - 24px)}#arcadex-chat-review .ax-compose input{font-size:16px}}
#arcadex-chat-review .ax.chat-open:not([data-scene="lobby"]) .ax-hint{visibility:hidden}
</style>
<script>
(()=>{
const root=document.getElementById('arcadex-chat-review');
const saved=window.openai?.widgetState?.privateContent?.scenes||{};
const states={},renderers={};
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'Chat xuyên game',contexts:['Sảnh','Caro PvP','Tank PvP','Điện thoại']},privateContent:{scenes:states}}).catch(()=>{});}
root.querySelectorAll('.ax').forEach(app=>{
 const scene=app.dataset.scene,lobby=scene==='lobby',tank=scene==='tank',phone=scene==='phone';
 const state=states[scene]={open:lobby,channel:lobby?'Sảnh':'Trận',expanded:false,unread:!lobby,large:false,...saved[scene]};
 const title=lobby?'Chơi cùng bạn bè':tank?'Tank Clash · PvP':'Caro · PvP';
 app.innerHTML=`<header class="ax-top"><span class="ax-brand">ARCADEX</span><div class="ax-title"><h2>${title}</h2><small>${lobby?'Thư viện game':'Trận đang diễn ra · 01:42'}</small></div></header><main class="ax-body"><div class="ax-content"></div><aside class="ax-rail"><div class="ax-player"><span class="ax-avatar">🐱</span><span>Minh Anh<small style="display:block">${lobby?'Đang ở sảnh':'Đối thủ · cùng trận'}</small></span></div><div class="ax-speech"><span>${lobby?'Ai chơi Caro cùng mình không?':'Nước này hay quá! 👏'}</span><button type="button" aria-label="Mở tin nhắn của Minh Anh"></button></div><hr class="ax-divider"><h3 class="ax-hint">${lobby?'Bạn bè đang chơi':'Vùng dành cho chat'}</h3><small class="ax-hint">${lobby?'Caro · 2 bạn<br>Nối Từ · 3 bạn':'Ngoài bàn chơi và nút điều khiển'}</small></aside></main><footer class="ax-foot"><span class="ax-status" role="status" aria-live="polite">${lobby?'Wireframe · khung nhỏ ở góc':'Wireframe · chat không dừng PvP'}</span><button type="button" class="ax-sim cursor-interaction">${lobby?'Bạn gửi thử':'Đối thủ gửi thử'}</button></footer><button type="button" class="ax-bubble cursor-interaction" aria-label="Chat · có tin chưa đọc · kéo để di chuyển" aria-expanded="false"><i data-lucide="message-circle" aria-hidden="true"></i><span class="ax-dot"></span></button><section class="ax-panel" aria-label="Khung chat" hidden><div class="ax-panel-head"><span class="ax-panel-name">Chat · ${state.channel}</span><button type="button" class="ax-size cursor-interaction" aria-label="Tăng hoặc giảm khung"><i data-lucide="scaling" aria-hidden="true"></i></button><button type="button" class="ax-expand cursor-interaction" aria-label="Phóng lớn hoặc khôi phục"><i data-lucide="maximize-2" aria-hidden="true"></i></button><button type="button" class="ax-close cursor-interaction" aria-label="Thu về bubble"><i data-lucide="minus" aria-hidden="true"></i></button></div><nav class="ax-channels" aria-label="Kênh chat"><button type="button" class="cursor-interaction" data-channel="${lobby?'Sảnh':'Trận'}">${lobby?'Sảnh':'Trận'}</button><button type="button" class="cursor-interaction" data-channel="Game">Game</button><button type="button" class="cursor-interaction" data-channel="Inbox">Inbox</button></nav><div class="ax-messages" role="log" aria-label="Tin nhắn mô phỏng"><div class="ax-message"><small>Minh Anh · vừa xong</small><span>${lobby?'Ai chơi Caro cùng mình không?':'Nước này hay quá! 👏'}</span></div></div><form class="ax-compose"><input aria-label="Tin nhắn mô phỏng" placeholder="Nhắn tin…" maxlength="1000"><button type="button" class="ax-send cursor-interaction">Gửi</button></form><span class="ax-resize" aria-hidden="true"></span></section>`;
 const content=app.querySelector('.ax-content');
 if(lobby){content.innerHTML='<h3>Chọn một game</h3><div class="ax-games"><div class="ax-game"><span class="ax-art">✕ ○</span><span>Caro</span><small>Đấu cùng bạn</small></div><div class="ax-game"><span class="ax-art">♟</span><span>Cờ vua</span><small>Thử thách trí tuệ</small></div><div class="ax-game"><span class="ax-art">▣</span><span>Tank Clash</span><small>PvP thời gian thực</small></div><div class="ax-game"><span class="ax-art">Aa</span><span>Nối Từ</span><small>Chơi cùng nhóm</small></div></div>';}
 else if(tank){content.innerHTML='<h3>Đấu trường</h3><div class="ax-arena"><span class="ax-map">Minimap</span><div class="ax-wall" style="left:26%;top:20%;width:18%;height:16px"></div><div class="ax-wall" style="left:55%;top:40%;width:16px;height:60px"></div><div class="ax-wall" style="left:22%;top:60%;width:22%;height:16px"></div><span class="ax-tank" style="left:22%;top:35%">A</span><span class="ax-tank" style="left:68%;top:32%">B</span><span class="ax-stick">Di chuyển</span><span class="ax-fire">Bắn</span></div><p class="ax-board-label">Bubble tránh minimap, joystick và nút bắn</p>';}
 else{content.innerHTML='<h3>Đến lượt bạn · X</h3><div class="ax-board" aria-label="Bàn Caro minh họa"></div><p class="ax-board-label">Vùng chơi · không đặt bubble tại đây</p>';const board=content.querySelector('.ax-board');[[40,40,'×'],[50,50,'○'],[50,40,'×'],[60,40,'○'],[30,50,'×'],[40,60,'○']].forEach(([x,y,t])=>{const stone=document.createElement('span');stone.className='ax-stone';stone.style.left=x+'%';stone.style.top=y+'%';stone.textContent=t;board.append(stone);});}
 const panel=app.querySelector('.ax-panel'),bubble=app.querySelector('.ax-bubble'),dot=app.querySelector('.ax-dot'),messages=app.querySelector('.ax-messages'),speech=app.querySelector('.ax-speech'),input=app.querySelector('input'),status=app.querySelector('.ax-status');
 let speechTimer,lastDrag=0;
 const primary=lobby?'Sảnh':'Trận';
 function paint(){app.classList.toggle("chat-open",state.open);if(app.clientWidth>0&&state.position){state.position.x=Math.max(8,Math.min(app.clientWidth-64,state.position.x));state.position.y=Math.max(8,Math.min(lobby?app.clientHeight-64:24,state.position.y));}panel.hidden=!state.open;bubble.hidden=state.open;dot.hidden=!state.unread;bubble.setAttribute('aria-label',state.unread?'Chat · có tin chưa đọc · kéo để di chuyển':'Mở chat · kéo để di chuyển');bubble.setAttribute('aria-expanded',String(state.open));panel.classList.toggle('expanded',state.expanded);panel.classList.toggle('large',state.large);panel.classList.toggle('game-open',!lobby);app.querySelector('.ax-panel-name').textContent='Chat · '+state.channel;app.querySelectorAll('[data-channel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.channel===state.channel)));if(state.position){bubble.style.left=state.position.x+'px';bubble.style.top=state.position.y+'px';bubble.style.right='auto';}if(state.panelPosition&&!state.expanded){panel.style.left=state.panelPosition.x+'px';panel.style.top=state.panelPosition.y+'px';panel.style.bottom='auto';}else if(!state.expanded){panel.style.left='';panel.style.top='';panel.style.bottom='';}if(state.open&&!lobby&&!state.panelPosition&&!state.expanded&&app.clientWidth>740){panel.style.left='auto';panel.style.right='16px';panel.style.top='260px';panel.style.bottom='auto';panel.style.width='290px';panel.style.height=state.large?'300px':'250px';}if(state.expanded){panel.style.right='';}input.placeholder='Nhắn vào '+state.channel+'…';}
 function open(){state.open=true;if(state.channel===primary)state.unread=false;paint();save();}
 function close(){state.open=false;state.expanded=false;paint();bubble.focus();save();}
 bubble.addEventListener('click',()=>{if(performance.now()-lastDrag>250)open();});
 app.querySelector('.ax-close').addEventListener('click',close);
 app.querySelector('.ax-expand').addEventListener('click',()=>{state.expanded=!state.expanded;paint();save();});
 app.querySelector('.ax-size').addEventListener('click',()=>{if(phone||app.clientWidth<740)state.expanded=!state.expanded;else state.large=!state.large;paint();save();});
 app.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{state.channel=b.dataset.channel;if(state.channel===primary)state.unread=false;messages.replaceChildren();append(state.channel===primary?'Minh Anh':state.channel==='Inbox'?'Bạn bè':'Cộng đồng',state.channel===primary?'Nước này hay quá! 👏':state.channel==='Inbox'?'Tối nay chơi tiếp nhé?':'Có ai đang chơi game này không?',false);paint();save();}));
 speech.querySelector('button').addEventListener('click',()=>{state.channel=primary;open();});
 function append(name,text,mine){const row=document.createElement('div');row.className='ax-message'+(mine?' mine':'');const label=document.createElement('small');label.textContent=name+' · vừa xong';const body=document.createElement('span');body.textContent=text;row.append(label,body);messages.append(row);messages.scrollTop=messages.scrollHeight;}
 const send=()=>{if(!input.value.trim())return;append('Bạn',input.value.trim(),true);input.value='';status.textContent='Tin mẫu đã gửi · '+state.channel;};app.querySelector('.ax-send').addEventListener('click',send);app.querySelector('form').addEventListener('submit',event=>{event.preventDefault();send();});input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing){event.preventDefault();send();}});
 app.querySelector('.ax-sim').addEventListener('click',()=>{clearTimeout(speechTimer);const text=lobby?'Mình vào Caro rồi, cùng chơi nhé!':'Hay quá! Đấu thêm ván nữa nhé?';speech.hidden=false;speech.querySelector('span').textContent=text;state.unread=!(state.open&&state.channel===primary);if(state.open&&state.channel===primary)append('Minh Anh',text,false);status.textContent=state.unread?'Có tin mới · chấm xanh trên bubble':'Đang xem · tin được đánh dấu đã đọc';paint();save();speechTimer=setTimeout(()=>{speech.hidden=true;},4000);});
 panel.addEventListener('keydown',event=>{if(event.key==='Escape'){event.stopPropagation();close();}});
 function drag(element,isPanel){let start=null;const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));element.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('button')&&isPanel||state.expanded&&isPanel)return;const rect=(isPanel?panel:bubble).getBoundingClientRect(),base=app.getBoundingClientRect();start={x:event.clientX,y:event.clientY,left:rect.left-base.left,top:rect.top-base.top,moved:false};element.setPointerCapture(event.pointerId);});element.addEventListener('pointermove',event=>{if(!start)return;const dx=event.clientX-start.x,dy=event.clientY-start.y;if(Math.hypot(dx,dy)<7&&!start.moved)return;start.moved=true;const target=isPanel?panel:bubble;let x=clamp(start.left+dx,8,app.clientWidth-target.offsetWidth-8),y=clamp(start.top+dy,8,app.clientHeight-target.offsetHeight-8);if(!lobby&&!isPanel)y=clamp(y,8,24);target.style.left=x+'px';target.style.top=y+'px';target.style.right='auto';target.style.bottom='auto';const point={x,y};if(isPanel)state.panelPosition=point;else state.position=point;});element.addEventListener('pointerup',()=>{if(start?.moved){lastDrag=performance.now();status.textContent=isPanel?'Đã dời khung chat':'Đã dời bubble · trong vùng công cụ';save();}start=null;});element.addEventListener('pointercancel',()=>{start=null;lastDrag=performance.now();});}
 drag(bubble,false);drag(app.querySelector('.ax-panel-head'),true);
 bubble.addEventListener('keydown',event=>{const arrows={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]};if(!arrows[event.key])return;event.preventDefault();const p=state.position||{x:app.clientWidth-66,y:15},[dx,dy]=arrows[event.key];state.position={x:Math.max(8,Math.min(app.clientWidth-56,p.x+dx)),y:Math.max(8,Math.min(lobby?app.clientHeight-56:24,p.y+dy))};paint();save();});
 let resize=null;const grip=app.querySelector('.ax-resize');grip.addEventListener('pointerdown',event=>{if(state.expanded||phone||app.clientWidth<740)return;resize={x:event.clientX,y:event.clientY,w:panel.offsetWidth,h:panel.offsetHeight};grip.setPointerCapture(event.pointerId);event.preventDefault();});grip.addEventListener('pointermove',event=>{if(!resize)return;const appRect=app.getBoundingClientRect(),rect=panel.getBoundingClientRect();panel.style.width=Math.max(280,Math.min(app.clientWidth-(rect.left-appRect.left)-12,resize.w+event.clientX-resize.x))+'px';panel.style.height=Math.max(220,Math.min(480,resize.h+event.clientY-resize.y))+'px';});grip.addEventListener('pointerup',()=>{resize=null;});grip.addEventListener('pointercancel',()=>{resize=null;});
 new ResizeObserver(()=>{if(app.clientWidth>0)paint();}).observe(app);
 renderers[scene]=paint;
 if(phone)state.expanded=false;
 paint();
 if(globalThis.Tweak){const design={speech:true,bubbleSize:48};const tweak=new Tweak({container:app,onChange:()=>{speech.hidden=!design.speech;bubble.style.width=design.bubbleSize+'px';bubble.style.height=design.bubbleSize+'px';}});tweak.addToggle(design,'speech',{label:'Lời nổi cạnh avatar'});tweak.addSlider(design,'bubbleSize',{label:'Kích thước bubble',min:44,max:56,step:4,unit:'px'});}
});
window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent?.scenes;if(!incoming)return;Object.keys(states).forEach(scene=>{if(incoming[scene]){Object.assign(states[scene],incoming[scene]);renderers[scene]();}});});
if(globalThis.lucide)lucide.createIcons({attrs:{width:19,height:19}});
})();
