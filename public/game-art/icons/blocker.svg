<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d1e"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <radialGradient id="prismGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="topaz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="250" height="250" rx="36" fill="url(#bg)"/>
  <circle cx="125" cy="125" r="112" fill="url(#prismGlow)"/>

  <!-- Diagonal Rainbow Supernova Laser Beam -->
  <path d="M18 228 L232 22" stroke="#f43f5e" stroke-width="26" stroke-linecap="round" opacity="0.45"/>
  <path d="M18 228 L232 22" stroke="#fde047" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
  <path d="M18 228 L232 22" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- 3D Faceted Jewel Block Cluster -->
  <g transform="translate(46 46)">
    <!-- Ruby Block (Top-Left) -->
    <g transform="translate(0 0)">
      <rect width="68" height="68" rx="12" fill="url(#ruby)" stroke="url(#goldFrame)" stroke-width="3"/>
      <polygon points="8,6 60,6 50,18 18,18" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="16" y="16" width="36" height="36" rx="6" fill="#f43f5e" stroke="#ffffff" stroke-opacity="0.5"/>
    </g>
    <!-- Sapphire Block (Top-Right) -->
    <g transform="translate(76 0)">
      <rect width="68" height="68" rx="12" fill="url(#sapphire)" stroke="url(#goldFrame)" stroke-width="3"/>
      <polygon points="8,6 60,6 50,18 18,18" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="16" y="16" width="36" height="36" rx="6" fill="#3b82f6" stroke="#ffffff" stroke-opacity="0.5"/>
    </g>
    <!-- Emerald Block (Bottom-Left) -->
    <g transform="translate(0 76)">
      <rect width="68" height="68" rx="12" fill="url(#emerald)" stroke="url(#goldFrame)" stroke-width="3"/>
      <polygon points="8,6 60,6 50,18 18,18" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="16" y="16" width="36" height="36" rx="6" fill="#10b981" stroke="#ffffff" stroke-opacity="0.5"/>
    </g>
    <!-- Star Core Topaz Jewel (Bottom-Right) -->
    <g transform="translate(76 76)">
      <rect width="68" height="68" rx="12" fill="url(#topaz)" stroke="#ffffff" stroke-width="3"/>
      <polygon points="34,10 40,28 58,34 40,40 34,58 28,40 10,34 28,28" fill="#ffffff"/>
    </g>
  </g>

  <!-- Flying Crystal Shards & Sparkles -->
  <polygon points="34,76 48,84 36,96 24,86" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="208,154 224,162 212,176 198,166" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="184,36 190,50 204,56 190,62 184,76 178,62 164,56 178,50" fill="#fef08a"/>

  <!-- Ornate Gold Border -->
  <rect x="6" y="6" width="238" height="238" rx="30" fill="none" stroke="url(#goldFrame)" stroke-width="4" stroke-opacity="0.85"/>
</svg>
