<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250">
  <defs>
    <linearGradient id="mummy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1108"/>
      <stop offset="50%" stop-color="#351e0d"/>
      <stop offset="100%" stop-color="#0f0905"/>
    </linearGradient>
    <radialGradient id="ankh-glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.72"/>
    </filter>
  </defs>
  <rect width="250" height="250" rx="34" fill="url(#mummy-bg)"/>
  <circle cx="125" cy="108" r="105" fill="url(#ankh-glow)"/>

  <!-- Pyramid & Tomb Portal Backdrop -->
  <path d="M24 206 L108 54 L194 206 Z" fill="#854d0e" opacity="0.55"/>
  <path d="M108 54 L144 206 L194 206 Z" fill="#451a03" opacity="0.65"/>
  <rect x="82" y="118" width="52" height="88" rx="4" fill="#090502" stroke="url(#gold-trim)" stroke-width="3"/>
  <circle cx="108" cy="158" r="16" fill="#2dd4bf" opacity="0.35"/>

  <!-- Sand Dunes -->
  <path d="M0 198 Q75 174 150 198 T250 188 V250 H0 Z" fill="#78350f"/>
  <path d="M0 212 Q95 190 175 215 T250 205 V250 H0 Z" fill="#451a03"/>

  <!-- Royal Pharaoh Mummy (Left-Center) -->
  <g transform="translate(26 62) scale(0.64)" filter="url(#drop)">
    <path d="M36 44 L20 112 L52 122 L64 198 H136 L148 122 L180 112 L164 44 Q100 18 36 44 Z" fill="url(#gold-trim)" stroke="#1c1108" stroke-width="5"/>
    <path d="M44 54 L32 106 M56 48 L46 108 M156 54 L168 106 M144 48 L154 108" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
    <path d="M62 110 H138 L132 194 H68 Z" fill="#991b1b" stroke="#1c1108" stroke-width="4.5"/>
    <path d="M66 128 L134 120 M66 150 L134 142 M68 172 L132 164" stroke="#f59e0b" stroke-width="5"/>
    <rect x="64" y="48" width="72" height="54" rx="18" fill="#fef3c7" stroke="#1c1108" stroke-width="4.5"/>
    <path d="M66 64 L134 58 M66 86 L134 80" stroke="#d6c7b2" stroke-width="5"/>
    <rect x="72" y="64" width="56" height="18" rx="7" fill="#090502"/>
    <circle cx="86" cy="73" r="6" fill="#ef4444"/>
    <circle cx="114" cy="73" r="6" fill="#ef4444"/>
    <circle cx="86" cy="73" r="2.5" fill="#fef08a"/>
    <circle cx="114" cy="73" r="2.5" fill="#fef08a"/>
    <!-- Cobra Uraeus -->
    <path d="M94 42 Q100 16 106 42 Z" fill="#fde047" stroke="#1c1108" stroke-width="3"/>
    <circle cx="100" cy="26" r="5" fill="#ef4444"/>
  </g>

  <!-- Golden Ankh & Scarab Emblem (Center-Top) -->
  <g transform="translate(114 26)" filter="url(#drop)">
    <ellipse cx="22" cy="18" rx="12" ry="15" fill="none" stroke="url(#gold-trim)" stroke-width="6"/>
    <path d="M8 34 H36 M22 33 V62" stroke="url(#gold-trim)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="22" cy="34" r="5" fill="#2dd4bf" stroke="#1c1108" stroke-width="2"/>
  </g>

  <!-- Explorer Archaeologist with Flaming Torch (Right) -->
  <g transform="translate(122 68) scale(0.62)" filter="url(#drop)">
    <!-- Torch Flame -->
    <circle cx="22" cy="48" r="32" fill="#fb923c" opacity="0.35"/>
    <path d="M22 12 C8 32 10 52 22 62 C34 52 36 32 22 12 Z" fill="#f97316"/>
    <path d="M22 24 C14 38 15 50 22 58 C29 50 30 38 22 24 Z" fill="#fef08a"/>
    <rect x="18" y="58" width="8" height="44" rx="3" fill="#78350f" stroke="#1c1108" stroke-width="3"/>
    <!-- Explorer Body -->
    <path d="M62 110 H138 L144 192 H56 Z" fill="#b45309" stroke="#1c1108" stroke-width="4.5"/>
    <path d="M84 110 H116 V188 H84 Z" fill="#fef3c7" stroke="#1c1108" stroke-width="3.5"/>
    <path d="M72 112 L128 178" stroke="#451a03" stroke-width="8" stroke-linecap="round"/>
    <!-- Explorer Head & Fedora -->
    <circle cx="100" cy="82" r="28" fill="#fdba74" stroke="#1c1108" stroke-width="4.5"/>
    <circle cx="88" cy="84" r="4.5" fill="#1c1108"/>
    <circle cx="112" cy="84" r="4.5" fill="#1c1108"/>
    <ellipse cx="100" cy="60" rx="52" ry="14" fill="#78350f" stroke="#1c1108" stroke-width="4.5"/>
    <path d="M64 58 Q74 24 100 28 Q126 24 136 58 Z" fill="#92400e" stroke="#1c1108" stroke-width="4.5"/>
    <path d="M66 54 Q100 62 134 54" fill="none" stroke="#f59e0b" stroke-width="5"/>
  </g>

  <!-- Outer Engraved Gold Frame -->
  <rect x="6" y="6" width="238" height="238" rx="29" fill="none" stroke="url(#gold-trim)" stroke-width="3.5" stroke-opacity="0.78"/>
  <rect x="13" y="13" width="224" height="224" rx="23" fill="none" stroke="#fef08a" stroke-width="1" stroke-opacity="0.28"/>
</svg>
