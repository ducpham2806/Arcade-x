<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140c06"/>
      <stop offset="52%" stop-color="#29170a"/>
      <stop offset="100%" stop-color="#0b0603"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 280) rotate(90) scale(290 360)">
      <stop stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="36" fill="url(#bg)"/>
  <circle cx="860" cy="280" r="320" fill="url(#portalGlow)"/>

  <!-- Hieroglyphic Temple Frieze Top & Bottom -->
  <rect x="0" y="0" width="1200" height="28" fill="#1f1208"/>
  <line x1="0" y1="28" x2="1200" y2="28" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="0" y="572" width="1200" height="28" fill="#1f1208"/>
  <line x1="0" y1="572" x2="1200" y2="572" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Left Banner Title Block -->
  <g transform="translate(72 128)">
    <rect x="0" y="0" width="236" height="44" rx="22" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="118" y="28" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="3">CURSE OF THE PHARAOH</text>
    <text x="0" y="122" fill="#fef3c7" font-family="Georgia, serif" font-size="68" font-weight="900" letter-spacing="2">MUMMY ESCAPE</text>
    <text x="0" y="172" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Giải mã mê cung Kim Tự Tháp · Thoát khỏi Xác Ướp Hoàng Gia</text>
    <rect x="0" y="218" width="248" height="68" rx="34" fill="url(#goldGrad)"/>
    <text x="124" y="261" text-anchor="middle" fill="#1c1108" font-family="system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="2">KHÁM PHÁ NGAY</text>
  </g>

  <!-- Right Tomb Chamber Illustration -->
  <g transform="translate(650 56)">
    <rect width="488" height="488" rx="36" fill="#1c1108" stroke="url(#goldGrad)" stroke-width="5"/>
    <!-- Pyramid & Glowing Portal -->
    <path d="M44 410 L214 96 L384 410 Z" fill="#78350f" opacity="0.6"/>
    <path d="M214 96 L284 410 L384 410 Z" fill="#451a03" opacity="0.75"/>
    <rect x="176" y="220" width="76" height="140" rx="6" fill="#090502" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="214" cy="290" r="24" fill="#2dd4bf" opacity="0.45"/>

    <!-- Royal Pharaoh Mummy -->
    <g transform="translate(48 118) scale(1.08)">
      <path d="M36 44 L20 112 L52 122 L64 198 H136 L148 122 L180 112 L164 44 Q100 18 36 44 Z" fill="url(#goldGrad)" stroke="#1c1108" stroke-width="5"/>
      <path d="M44 54 L32 106 M56 48 L46 108 M156 54 L168 106 M144 48 L154 108" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
      <path d="M62 110 H138 L132 194 H68 Z" fill="#991b1b" stroke="#1c1108" stroke-width="4.5"/>
      <rect x="64" y="48" width="72" height="54" rx="18" fill="#fef3c7" stroke="#1c1108" stroke-width="4.5"/>
      <rect x="72" y="64" width="56" height="18" rx="7" fill="#090502"/>
      <circle cx="86" cy="73" r="6" fill="#ef4444"/>
      <circle cx="114" cy="73" r="6" fill="#ef4444"/>
    </g>

    <!-- Explorer Archaeologist -->
    <g transform="translate(256 128) scale(1.05)">
      <circle cx="22" cy="48" r="36" fill="#fb923c" opacity="0.35"/>
      <path d="M22 12 C8 32 10 52 22 62 C34 52 36 32 22 12 Z" fill="#f97316"/>
      <path d="M22 24 C14 38 15 50 22 58 C29 50 30 38 22 24 Z" fill="#fef08a"/>
      <rect x="18" y="58" width="8" height="44" rx="3" fill="#78350f" stroke="#1c1108" stroke-width="3"/>
      <path d="M62 110 H138 L144 192 H56 Z" fill="#b45309" stroke="#1c1108" stroke-width="4.5"/>
      <path d="M84 110 H116 V188 H84 Z" fill="#fef3c7" stroke="#1c1108" stroke-width="3.5"/>
      <circle cx="100" cy="82" r="28" fill="#fdba74" stroke="#1c1108" stroke-width="4.5"/>
      <circle cx="88" cy="84" r="4.5" fill="#1c1108"/>
      <circle cx="112" cy="84" r="4.5" fill="#1c1108"/>
      <ellipse cx="100" cy="60" rx="52" ry="14" fill="#78350f" stroke="#1c1108" stroke-width="4.5"/>
      <path d="M64 58 Q74 24 100 28 Q126 24 136 58 Z" fill="#92400e" stroke="#1c1108" stroke-width="4.5"/>
    </g>
  </g>
</svg>
