    <rect x="0" y="218" width="256" height="68" rx="34" fill="url(#goldGrad)"/>
    <text x="128" y="261" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="24" font-weight="900" letter-spacing="2">CHƠI NGAY</text>
