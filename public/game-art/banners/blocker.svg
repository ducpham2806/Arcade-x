    <path d="M24 244 H464" stroke="#f43f5e" stroke-width="46" opacity="0.4"/>
    <path d="M24 244 H464" stroke="#fde047" stroke-width="20" opacity="0.85"/>
    <path d="M24 244 H464" stroke="#ffffff" stroke-width="8"/>
