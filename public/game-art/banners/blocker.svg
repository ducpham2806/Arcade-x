<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d1e"/>
    </linearGradient>
    <radialGradient id="novaGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 290) rotate(90) scale(290 360)">
      <stop stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ec4899" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="36" fill="url(#bg)"/>
  <circle cx="860" cy="290" r="330" fill="url(#novaGlow)"/>

  <!-- Left Title Block -->
  <g transform="translate(72 124)">
