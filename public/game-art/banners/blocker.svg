    <circle cx="244" cy="244" r="95" stroke="#fde047" stroke-width="4" opacity="0.9"/>
    <g transform="translate(104 104)">
      <rect x="0" y="0" width="128" height="128" rx="22" fill="#f43f5e" stroke="#fde047" stroke-width="4"/>
      <rect x="148" y="0" width="128" height="128" rx="22" fill="#3b82f6" stroke="#fde047" stroke-width="4"/>
      <rect x="0" y="148" width="128" height="128" rx="22" fill="#10b981" stroke="#fde047" stroke-width="4"/>
