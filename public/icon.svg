<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#181528"/>
      <stop offset="100%" stop-color="#090810"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Arcade Game Controller Body -->
  <path d="M140 180 C95 180 60 215 60 260 C60 320 100 370 150 370 C175 370 195 350 215 330 C230 315 245 310 256 310 C267 310 282 315 297 330 C317 350 337 370 362 370 C412 370 452 320 452 260 C452 215 417 180 372 180 Z" fill="#14141e" stroke="url(#primaryGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- D-Pad (Left) -->
  <g transform="translate(145, 260)">
    <rect x="-11" y="-36" width="22" height="72" rx="5" fill="#312e81"/>
    <rect x="-36" y="-11" width="72" height="22" rx="5" fill="#312e81"/>
    <circle cx="0" cy="0" r="6" fill="#6366f1"/>
    <!-- Direction arrows -->
    <path d="M0 -28 L-5 -21 L5 -21 Z" fill="#a5b4fc"/>
    <path d="M0 28 L-5 21 L5 21 Z" fill="#a5b4fc"/>
    <path d="M-28 0 L-21 -5 L-21 5 Z" fill="#a5b4fc"/>
    <path d="M28 0 L21 -5 L21 5 Z" fill="#a5b4fc"/>
  </g>

  <!-- Action Buttons (Right) -->
  <g transform="translate(365, 260)">
    <!-- X (Top) -->
    <circle cx="0" cy="-24" r="13" fill="#ef4444"/>
    <text x="0" y="-19" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">Y</text>
    <!-- B (Right) -->
    <circle cx="24" cy="0" r="13" fill="#f59e0b"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" transform="translate(24, 0)">B</text>
    <!-- A (Bottom) -->
    <circle cx="0" cy="24" r="13" fill="#10b981"/>
    <text x="0" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Y (Left) -->
    <circle cx="-24" cy="0" r="13" fill="#3b82f6"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" transform="translate(-24, 0)">X</text>
  </g>

  <!-- Center Branding: ArcadeX "X" Starburst -->
  <g transform="translate(256, 250)">
    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- ArcadeX Modern Wordmark -->
  <text x="256" y="430" font-family="Chakra Petch, system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">
    ARCADE<tspan fill="#ec4899">X</tspan>
  </text>
  <text x="256" y="456" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#818cf8" text-anchor="middle">
    INSTANT PWA
  </text>
</svg>
