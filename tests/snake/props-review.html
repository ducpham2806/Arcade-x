<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R01 · Props tương tác A2</title><style>html,body{margin:0;height:100%;font:13px system-ui;background:#142e27;color:#fff3d8}nav{height:52px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 8px;box-sizing:border-box}button,select{min-height:36px;font:inherit}#root{height:calc(100dvh - 52px)}.fixture{height:100%;position:relative}.fixture canvas{width:100%;height:100%;display:block}.fixture p{position:absolute;bottom:12px;left:16px;background:#183c30;padding:8px 12px;border-radius:8px;margin:0;max-width:75%}iframe{display:block;border:0;margin:auto;width:100%;height:100%}iframe.phone{width:360px;height:800px;max-width:100%}</style><body><nav id="nav"></nav><main id="root"></main><script type="module">
import {Engine} from '../../src/games/snake-legend/src/core';import {STORY_LEVELS} from '../../src/games/snake-legend/src/story-data';import {Renderer} from '../../src/games/snake-legend/src/render';
const root=document.getElementById('root'),nav=document.getElementById('nav'),params=new URL(location.href).searchParams;
if(params.has('frame')){
 nav.innerHTML='<select id="scene" aria-label="Vật thể"><option value="exit">Cổng ngọc</option><option value="switch">Công tắc</option><option value="barrier">Cửa chắn</option></select><select id="state" aria-label="Trạng thái"><option value="closed">Khóa / chưa chạm</option><option value="ready">Mở / đã chốt</option></select>';
 root.innerHTML='<div class="fixture"><canvas aria-label="Sân thử props R01"></canvas><p>QA hình ảnh · bản đồ và renderer thật · trạng thái chọn tay</p></div>';const renderer=new Renderer(root.querySelector('canvas'));renderer.masterArt=true;renderer.zoom=.8;
 function draw(){const scene=document.getElementById('scene').value,ready=document.getElementById('state').value==='ready',arena=structuredClone(STORY_LEVELS[scene==='exit'?0:5]),s=arena.story,target=scene==='exit'?s.exit:scene==='switch'?s.switch:{x:s.gate.x+s.gate.w/2,y:s.gate.y};arena.start={x:target.x-4,y:target.y+3};const e=new Engine(arena);e.switchOn=ready;e.goalReady=ready;e.tick=300;renderer.draw(e,1);}
 nav.addEventListener('change',draw);draw();for(const im of Object.values(renderer.images))im.addEventListener('load',draw,{once:true});new ResizeObserver(draw).observe(root);window.addEventListener('pagehide',()=>renderer.destroy(),{once:true});
}else{
 nav.innerHTML='<span>R01 · Props A2</span><button id="desktop">Máy tính</button><button id="phone">360px</button><a style="color:inherit" href="journey-review.html">Chơi hành trình</a>';root.innerHTML='<iframe title="Props tương tác" src="?frame=1"></iframe>';document.getElementById('phone').onclick=()=>root.querySelector('iframe').classList.add('phone');document.getElementById('desktop').onclick=()=>root.querySelector('iframe').classList.remove('phone');
}
</script></body></html>
