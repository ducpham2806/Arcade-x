<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R01 · Kiểm tra Nhện Mẹ</title><style>html,body{margin:0;height:100%;font:13px system-ui;background:#142e27;color:#fff3d8}nav{height:52px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 8px;box-sizing:border-box}button,select{min-height:36px;font:inherit}#root{height:calc(100dvh - 52px)}.fixture{height:100%;position:relative}.fixture canvas{width:100%;height:100%;display:block}.fixture p{position:absolute;bottom:12px;left:16px;background:#183c30;padding:8px 12px;border-radius:8px;margin:0}iframe{display:block;border:0;margin:auto;width:100%;height:100%}iframe.phone{width:360px;height:800px;max-width:100%}</style><body><nav id="nav"></nav><main id="root"></main><script type="module">
import {Engine} from '../../src/games/snake-legend/src/core';import {STORY_LEVELS} from '../../src/games/snake-legend/src/story-data';import {Renderer} from '../../src/games/snake-legend/src/render';import {bossCue} from '../../src/games/snake-legend/src/boss-presentation';
const root=document.getElementById('root'),nav=document.getElementById('nav'),params=new URL(location.href).searchParams;
if(params.has('play')){
 await import('../../src/games/snake-legend/src/styles.css');const {mountStory}=await import('../../src/games/snake-legend/src/story-app');const {blankCampaign,CAMPAIGN_KEY}=await import('../../src/games/snake-legend/src/story-save');
 const campaign=blankCampaign();for(let i=1;i<=9;i++)campaign.levels['1-'+i]={stars:[true,true,true],bestScore:100,bestTime:30};const data=new Map([[CAMPAIGN_KEY,JSON.stringify(campaign)]]);const storage={getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,v)};
 const hooks={storage,newRun(){},prepare:async()=>true,useLocal(){},input(){},acknowledgeTutorial(){},complete(){},retry:async()=>{},status:()=>({message:'Phiên QA riêng · không ghi tiến trình tài khoản',starting:false,canRetry:false,canPlayLocal:false,pending:0}),subscribe:()=>()=>{},destroy(){}};
 nav.textContent='QA · Màn 1-10 thật · tiến trình tạm trong bộ nhớ';const game=mountStory(root,()=>{},hooks,{levelIndex:9,resumeCheckpoint:false});window.addEventListener('pagehide',()=>game.destroy(),{once:true});
}else if(params.has('frame')){
 nav.innerHTML='<label>Pha <select id="phase"><option>1</option><option>2</option><option>3</option></select></label><select id="state" aria-label="Trạng thái Nhện Mẹ">'+['idle','telegraph','attack','recovery','weak','hurt','phase_change','defeated'].map(s=>'<option>'+s+'</option>').join('')+'</select><span>Ảnh QA</span>';
 root.innerHTML='<div class="fixture"><canvas aria-label="Sân thử hình ảnh Nhện Mẹ"></canvas><p></p></div>';const e=new Engine(STORY_LEVELS[9]),enc=e.encounters;e.pos={x:27.5,y:35};e.previous[0]={...e.pos};e.body[0]={...e.pos};const renderer=new Renderer(root.querySelector('canvas'));renderer.masterArt=true;renderer.zoom=.8;
 function draw(){enc.state=document.getElementById('state').value;enc.phase=Number(document.getElementById('phase').value);enc.totalHits=(enc.phase-1)*2;enc.timer=enc.state==='weak'?90:enc.state==='telegraph'?28:20;enc.anchors=[true,true];enc.anchorTicks=12;enc.shot={from:{...enc.boss.center},to:{x:32,y:44}};renderer.draw(e,1);root.querySelector('p').textContent=bossCue(enc,16).label;}
 nav.addEventListener('change',draw);for(const im of Object.values(renderer.images))im.addEventListener('load',draw,{once:true});new ResizeObserver(draw).observe(root);draw();window.addEventListener('pagehide',()=>renderer.destroy(),{once:true});
}else{
 nav.innerHTML='<span>R01 · Kiểm tra hình ảnh</span><button id="desktop">Máy tính</button><button id="phone">360px</button><a href="?live=1" style="color:inherit">Chơi boss thật</a>';root.innerHTML='<iframe title="Trạng thái Nhện Mẹ" src="'+(params.has('live')?'?play=1':'?frame=1')+'"></iframe>';document.getElementById('phone').onclick=()=>root.querySelector('iframe').classList.add('phone');document.getElementById('desktop').onclick=()=>root.querySelector('iframe').classList.remove('phone');
}
</script></body></html>
