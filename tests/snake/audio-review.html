<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R01 · Kiểm tra âm thanh</title><style>body{font:15px system-ui;background:#173d32;color:#fff5d6;margin:0;padding:24px}main{max-width:650px;margin:auto}h1{font-size:26px}section{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{font:inherit;border:1px solid #a4ba91;border-radius:10px;padding:12px 18px;min-height:46px;background:#eff0d9;color:#244c3a;cursor:pointer}output{display:block;background:#102b25;padding:16px;line-height:1.8;white-space:pre-wrap;border-radius:12px}a{color:inherit}p{line-height:1.6;color:#c1d3b1}</style><body><main><h1>R01 · Kiểm tra âm thanh</h1><p>Nhấp từng nút để phát một âm. Không có nhạc tự chạy. Trang QA dùng mixer thật; không mở tài khoản hay sửa tiến trình.</p><section><button data-sound="dash">Dash · gió lướt</button><button data-sound="bossWeak">Mở điểm yếu</button><button data-sound="bossPhase">Chuyển pha</button><button data-sound="bossWarn">Báo đòn cũ</button></section><section><button id="pause">Tạm dừng âm</button><button id="mute">Tắt âm</button><button id="refresh">Cập nhật số liệu</button></section><output id="state" aria-live="polite"></output><p><a href="journey-review.html">Chơi hành trình R01</a></p></main><script type="module">
import {GameAudio} from '../../src/games/snake-legend/src/audio';
const mixer=new GameAudio();let paused=false,muted=false;const output=document.getElementById('state');
const update=message=>output.textContent=(message||'Sẵn sàng kiểm tra')+'\n'+JSON.stringify(mixer.diagnostics,null,2);
for(const button of document.querySelectorAll('[data-sound]'))button.addEventListener('click',async()=>{mixer.setEnabled(true);const unlocked=await mixer.unlock();mixer.setPaused(paused);update(unlocked&&mixer.emit(button.dataset.sound)?'Đã phát: '+button.textContent:'Âm bị chặn hoặc đang tạm dừng. '+mixer.error);});
document.getElementById('pause').onclick=()=>{paused=!paused;mixer.setPaused(paused);document.getElementById('pause').textContent=paused?'Tiếp tục âm':'Tạm dừng âm';update();};document.getElementById('mute').onclick=()=>{muted=!muted;mixer.setMuted(muted);document.getElementById('mute').textContent=muted?'Bật âm':'Tắt âm';update();};document.getElementById('refresh').onclick=()=>update();update();window.addEventListener('pagehide',()=>mixer.destroy(),{once:true});
</script></body></html>
