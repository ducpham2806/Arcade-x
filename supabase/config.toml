project_id = "arcade-x"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
enable_anonymous_sign_ins = true

# Cosmic handler also checks auth.getUser and ticket ownership.
[functions.cosmic-verify]
verify_jwt = true

# Word Chain verifies registered users via Auth.getUser and cron with a tick-only token.
# Per-project deployment approval and evidence: docs/word-chain/PUBLIC-RELEASE-2026-11-08.md.
[functions.word-chain-room]
verify_jwt = false
