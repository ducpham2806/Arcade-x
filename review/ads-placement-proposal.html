<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ArcadeX — đề xuất vị trí quảng cáo</title>
<style>

p:5px;margin:32px 0;min-height:108px;overflow-wrap:anywhere}.ad-slot .label{font-size:10px;letter-spacing:2px;font-weight:700}.ad-slot strong{font-size:14px}.ad-slot small{font-size:11px}.ad-l1{max-width:970px;margin-left:auto;margin-right:auto}.ad-l2{min-height:140px}.section-head{margin:36px 0 18px;display:flex;gap:18px;justify-content:space-between;align-items:center;flex-wrap:wrap}.search{border:1px solid #cad3c7;border-radius:7px;background:#fff;padding:12px 16px;color:#66756d;font-size:13px;min-width:200px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}.filters span{border:1px solid #cdd8ca;border-radius:18px;padding:8px 14px;font-size:12px}.filters span:first-child{background:#204c3c;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.game-card{background:#fff;border:1px solid #dce0d5;border-radius:12px;padding:16px;min-width:0}.game-art{height:90px;border-radius:8px;background:var(--tone);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#274c40;letter-spacing:-2px}.game-card h3{margin:14px 0 6px;font-size:15px}.game-card p{font-size:12px;color:#6a7c71;margin:0 0 12px}.play-link{min-height:44px;padding:10px 14px;border:1px solid #bbcbbc;border-radius:7px;background:#f3f7ef;color:#275340;font-size:12px;font-weight:700}.section-note{font-size:12px;color:#6c7b72;margin:14px 0}.foot{padding:32px 0 90px;display:flex;gap:18px;justify-content:space-between;font-size:12px;color:#617369;flex-wrap:wrap;margin-top:32px;border-top:1px solid #d4ddd0}.mobile-nav{display:none}.game-mode{margin-top:28px;background:#122923;color:#eaf3e9;min-height:520px;border-radius:18px;display:grid;place-content:center;text-align:center;padding:32px}.game-mode .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;color:#b2d5bd}.game-mode h1{font-size:38px;margin-top:20px}.game-mode p{max-width:550px;color:#bfd2c4}.game-mode button{margin-top:20px}.guide{max-width:820px;margin:35px auto}.guide h1{font-size:40px}.guide h2{font-size:23px;margin:30px 0 16px}.guide p,.guide li{color:#4c6158;line-height:1.9}.guide .ad-slot{min-height:220px}.guide .sample{border-left:4px solid #bdcdb5;padding-left:16px;font-size:14px}.legend{font-size:12px;background:#fff9df;border:1px solid #e4dab3;border-radius:8px;padding:16px;margin:28px 0;color:#75613b}.mobile-only{display:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-aside{display:none}.hero{padding:28px}.site-head{padding:20px 0}}@media(max-width:639px){.wrap{padding:0 16px}.review-bar{padding:14px 16px}.tabs button{padding:8px 10px;font-size:12px}.head-note{max-width:120px;text-align:right}.hero{margin-top:20px;padding:24px 20px}.hero h1{letter-spacing:-1.5px}.hero p{font-size:14px}.intro{font-size:13px;margin:22px 0}.ad-l1{display:none}.grid{gap:12px}.game-card{padding:12px}.game-art{height:78px}.game-card h3{font-size:13px;min-height:34px}.game-card p{font-size:11px}.play-link{width:100%}.search{width:100%;min-width:0}.ad-l2{min-height:125px;margin:32px 0}.site-head .logo{font-size:22px}.section-head h2{font-size:22px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;padding:14px 20px max(14px,env(safe-area-inset-bottom));background:#fbfcf6;border-top:1px solid #cfd9c9;justify-content:space-around;font-size:12px;z-index:2}.mobile-only{display:inline}.guide h1{font-size:32px}.game-mode{padding:24px;min-height:450px}.game-mode h1{font-size:32px}.game-mode p{font-size:14px}}
</style></head><body>
<div class="review-bar"><p><strong>Đề xuất vị trí quảng cáo · 11/11/2026</strong>Wireframe để duyệt bố cục. Không có quảng cáo Google thật; desktop hiện hai vị trí để so sánh, pilot chỉ bật một.</p><div class="tabs" role="tablist" aria-label="Xem trạng thái"><button role="tab" id="tab-library" aria-selected="true" data-mode="library" aria-controls="proposal">Thư viện</button><button role="tab" id="tab-guide" aria-selected="false" data-mode="guide" aria-controls="proposal">Hướng dẫn</button><button role="tab" id="tab-playing" aria-selected="false" data-mode="playing" aria-controls="proposal">Đang chơi</button></div></div>
<div class="wrap"><header class="site-head"><div class="logo">ARCADE<span>X</span></div><span class="head-note">Bản bố cục mẫu · chưa tích hợp</span></header><main id="proposal" role="tabpanel" aria-labelledby="tab-library"></main></div>
<script>
const names=['Tank Clash','Nối Từ','Car Escape','Blossom Blast','Word Cross','Shikaku','Neon Run','Xếp Gạch 2048','Battleship','Dungeon Titan','Boom Buddies','Rainbow Blocks'];
const tones=['#dce8d1','#e3def1','#f4e2cb','#dfe9d8','#ece3d2','#dae4ee'];
const ad=(id,cls,note)=>`<section class="ad-slot ${cls}" aria-label="Vị trí quảng cáo ${id}"><span class="label">QUẢNG CÁO</span><strong>${id} · vị trí đề xuất</strong><small>${note}</small></section>`;
const cards=(start,end)=>`<div class="grid">${names.slice(start,end).map((n,i)=>`<article class="game-card"><div class="game-art" style="--tone:${tones[(start+i)%tones.length]}">${String(start+i+1).padStart(2,'0')}</div><h3>${n}</h3><p>Thẻ game mẫu để duyệt vị trí.</p><button class="play-link" data-mode="playing" aria-label="Xem vùng chơi mẫu cho ${n}">Chơi thử bố cục →</button></article>`).join('')}</div>`;
const footer=()=>`<footer class="foot"><span>ArcadeX · không gian dành cho trò chơi</span><span>Giới thiệu · Liên hệ · Quyền riêng tư</span></footer>`;
function render(mode){
 document.querySelectorAll('[role=tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.mode===mode));b.tabIndex=b.dataset.mode===mode?0:-1;});
 const root=document.getElementById('proposal');root.setAttribute('aria-labelledby',`tab-${mode}`);
 if(mode==='playing')root.innerHTML=`<section class="game-mode"><span class="badge">TRẠNG THÁI ĐANG CHƠI</span><h1>Toàn bộ không gian<br>dành cho game.</h1><p>Không có slot quảng cáo trong canvas, HUD, nút điều khiển, phòng chờ hay kết quả. Đây là vùng chơi minh họa, không phải game thật.</p><div><button class="primary" data-mode="library">Về thư viện</button></div></section>${footer()}`;
 else if(mode==='guide')root.innerHTML=`<article class="guide"><p class="eyebrow">TRANG HƯỚNG DẪN · BỐ CỤC MINH HỌA</p><h1>Cách chơi Nối Từ</h1><p class="sample">Đoạn mẫu để duyệt vị trí. Trang thật cần nội dung biên tập, hướng dẫn và hình ảnh phù hợp trước khi đặt quảng cáo.</p><h2>Nối từ như thế nào?</h2><p>Mỗi từ có hai âm tiết. Từ tiếp theo bắt đầu bằng âm tiết cuối của từ trước, chẳng hạn “con mèo” → “mèo con”. Từ phải nằm trong từ điển và chưa được dùng trong trận.</p><h2>Vào trận và điều khiển</h2><p>Chọn luyện với bot hoặc đăng nhập để vào phòng online. Gõ từ bằng bàn phím, kiểm tra dấu trước khi gửi và theo dõi thời gian của lượt. Người cuối cùng còn lại thắng.</p>${ad('AD-G1','','Sau nội dung hữu ích; không dùng popup ngắn thay cho bài hướng dẫn.')}<h2>Mẹo cho người mới</h2><p>Đọc âm tiết cần nối trước khi gõ. Thử từ quen thuộc trước; nếu từ không được nhận, dùng thời gian còn lại để sửa. Giao diện và luật của bản phát hành phải được đối chiếu khi viết hướng dẫn thật.</p><button class="primary" data-mode="playing">Xem vùng chơi mẫu</button></article>${footer()}`;
 else root.innerHTML=`<section class="hero"><div><p class="eyebrow">KHÁM PHÁ THƯ VIỆN GAME</p><h1>Chọn game.<br>Chơi theo cách của bạn.</h1><p>Giữ banner và nút Chơi rõ ràng. Quảng cáo nằm trong section riêng, không ngụy trang thành game hoặc chen vào nút điều khiển.</p><button class="primary" data-mode="playing">Chơi ngay →</button></div><aside class="hero-aside">24 game đã có trong catalog nguồn.<br><br>Các card dưới đây chỉ là mẫu bố cục, không thay giao diện launcher hiện tại.</aside></section><p class="intro">Vùng giới thiệu hữu ích: bản thật cần giải thích cách chọn game, điều khiển và lưu tiến trình. Nội dung gốc của website phải là trọng tâm; quảng cáo không thay cho hướng dẫn hoặc trải nghiệm chơi.</p>${ad('AD-L1','ad-l1','Desktop responsive · mặc định ẩn trên điện thoại.')}<div class="section-head"><h2>Thư viện game</h2><div class="search">Tìm trò chơi…</div></div><div class="filters"><span>Tất cả</span><span>Giải đố</span><span>Arcade</span><span>Đối kháng</span></div>${cards(0,8)}${ad('AD-L2','ad-l2','Sau tám thẻ game · responsive theo container, không bám đáy.')}<p class="section-note">Phần game còn lại · mẫu rút gọn</p>${cards(8,12)}<p class="legend">Đề xuất pilot: desktop L1 hoặc mobile L2. Không tăng impression bằng filter/re-render; khi bắt đầu game, các slot được dỡ khỏi view.</p>${footer()}<nav class="mobile-nav" aria-label="Điều hướng mobile mẫu"><span>Thư viện</span><span>Yêu thích</span><span>Hồ sơ</span></nav>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-mode]');if(b){render(b.dataset.mode);window.scrollTo(0,0);}});
document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('[role=tab]')],at=tabs.indexOf(document.activeElement);if(at<0)return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(at+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;render(tabs[next].dataset.mode);tabs[next].focus();});
render('library');
</script></body></html>
