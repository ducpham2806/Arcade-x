<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ArcadeX - Instant Game Launcher and PWA Platform</title>
    <meta name="description" content="Nền tảng Instant Game Launcher PWA tích hợp kho game arcade, đấu trí đối kháng PvP thời gian thực (Cờ Tướng, Cờ Caro Gomoku) với hệ thống ghép trận ELO, mở rương, thành tựu và bảng xếp hạng." />
    <meta property="og:title" content="ArcadeX - Instant Game Launcher and PWA Platform" />
    <meta property="og:description" content="Nền tảng Instant Game Launcher PWA tích hợp kho game arcade, đấu trí đối kháng PvP thời gian thực (Cờ Tướng, Cờ Caro Gomoku) với hệ thống ghép trận ELO, mở rương, thành tựu và bảng xếp hạng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#3f56d9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArcadeX" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-slate-200 selection:bg-indigo-500 selection:text-white overflow-x-hidden min-h-screen">
    <div id="root">
      <style>
        #initial-boot{position:fixed;inset:0;display:grid;place-items:center;background:#f7f9fc;color:#263657;font:16px system-ui,sans-serif;text-align:center;padding:24px}
        #initial-boot img{width:86px;height:86px;animation:initial-pulse 2s ease-in-out infinite}
        #initial-boot h1{font-size:32px;letter-spacing:3px;margin:24px 0 12px}
        #initial-boot p{color:#65738c;font-size:14px}
        #initial-boot .track{width:min(76vw,320px);height:6px;background:#dce2ef;border-radius:99px;overflow:hidden;margin:24px auto}
        #initial-boot .track:after{content:'';display:block;width:40%;height:100%;background:#4658df;border-radius:99px;animation:initial-sweep 1.8s ease-in-out infinite}
        @keyframes initial-pulse{50%{transform:translateY(-6px)}}
        @keyframes initial-sweep{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
        @media(prefers-reduced-motion:reduce){#initial-boot img,#initial-boot .track:after{animation:none}}
      </style>
      <div id="initial-boot" role="status"><div><img src="/icon.svg" alt=""/><h1>ARCADEX</h1><p>Đang mở launcher…</p><div class="track" aria-hidden="true"></div><p>Chỉ tải game khi bạn chọn chơi.</p></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
